name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Exercise provider-free integration demo
        run: npm run demo

      - name: Scan reachable Git history for high-confidence secrets
        run: npm run security:scan-history

      - name: Type-check
        run: npm run typecheck

      - name: Build Worker
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
